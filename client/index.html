<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapspace</title>
</head>
<body>
    <div id="InputName">
        <input type="text" placeholder="Your Name.." id="user">
    </div>
    <a href="chat.html"><button id="uok">go to chat page</button></a>
    <script>
        const u = document.querySelector('#user');
        const ok = document.querySelector('#uok');
        function change(){
            const user = u.value;
            localStorage.setItem("user" , `${user}`);
            console.log(user);
        }

        ok.addEventListener("click" , change);
    </script>
</body>
</html>
